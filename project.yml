name: Aletheia
options:
  bundleIdPrefix: com.aletheia
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ad-hoc signed: no Apple Developer account needed. Gatekeeper will
    # require a right-click > Open the first time it's launched, which
    # is covered in docs/SETUP-GUIDE.md.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      # Debug compiles at the `dev` build tier: every feature module's code is
      # included, so local runs and the unit tests exercise the full feature
      # surface. `DEBUG` is Xcode's default Debug condition, preserved here
      # alongside the tier flags. The tiers nest (production ⊂ preview ⊂ dev),
      # so a dev build defines ALETHEIA_PREVIEW too. See BuildTier.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG ALETHEIA_PREVIEW ALETHEIA_DEV
    Release:
      # Release ships the `production` tier: no ALETHEIA_* conditions are
      # defined, so preview/dev-only code (e.g. App Intents) is compiled out of
      # the shipped binary entirely — not merely hidden at runtime.
      #
      # Hardened Runtime only matters for distribution, and it interferes
      # with XCTest injecting its bundle into the host app, so keep it off
      # for Debug (where tests run) and on for the Release build that
      # scripts/build.sh ships.
      ENABLE_HARDENED_RUNTIME: YES

packages:
  # The current official whisper.cpp (ggml-org) as its prebuilt XCFramework,
  # pinned by URL + checksum in the local package, wrapped by the WhisperEngine
  # framework target.
  WhisperCpp:
    path: Packages/WhisperCpp
  # The official llama.cpp (ggml-org) as its prebuilt XCFramework, pinned by
  # URL + checksum in the local package (tag b11149). It links and embeds in
  # every tier; whether the built-in model is *offered* is gated separately by
  # `EmbeddedLlamaFeatureModule`. Only the official ggml-org runtime is used
  # (supply-chain constraint).
  LlamaCpp:
    path: Packages/LlamaCpp

targets:
  Aletheia:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/App
        excludes:
          - "Resources/Info.plist"
          - "Resources/Aletheia.entitlements"
          - "Resources/AletheiaDev.entitlements"
      # The wire contract with the network helper, compiled into both sides.
      - path: Sources/NetworkHelperShared
      # The repo-root notices, copied into the app so Settings › Licenses shows
      # exactly this file (ThirdPartyNoticesTests compares the two).
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
      # The terms and privacy policy, copied into the app so their SHA-256 can be
      # compared with the hashes recorded in a license (LicenseTermsTests compares
      # the bundled bytes with the repo files).
      - path: TERMS.md
        buildPhase: resources
      - path: PRIVACY.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aletheia.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # `info:`/`entitlements:` target keys tell XcodeGen to *generate* the
        # file at that path from its own template + `properties:` on every
        # `xcodegen generate`, overwriting whatever's checked in (see #104).
        # These two files are hand-maintained (and Info.plist's version keys
        # are rewritten in place by scripts/apply-release.sh), so point Xcode
        # straight at them via plain build settings instead — XcodeGen only
        # rewrites the file content for the `info:`/`entitlements:` keys,
        # not for these. GENERATE_INFOPLIST_FILE isn't set here, so it keeps
        # Xcode's default of YES, which expands the $(...) build-setting
        # placeholders in Info.plist (e.g. CFBundleIdentifier) at build time.
        INFOPLIST_FILE: Sources/App/Resources/Info.plist
        # Info.plist is preprocessed so the dev tier alone can carry the
        # Calendar and Reminders purpose strings (under #ifdef ALETHEIA_DEV;
        # only Debug defines it).
        INFOPLIST_PREPROCESS: YES
      # Least privilege: entitlements are chosen per config, mirroring the build
      # tiers. Release (production) omits the calendars entitlement because
      # EventKit scheduling is a `.dev`-tier feature (EventKitSchedulingFeatureModule);
      # Debug (dev tier) adds it. Deliberately NOT set in `base`, so a new config
      # can't silently inherit the wider set. Plain build settings, not the
      # `entitlements:` key, for the same reason as INFOPLIST_FILE above (#104/#105).
      # scripts/check-entitlements.sh (CI) guards this wiring and the file contents.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/App/Resources/AletheiaDev.entitlements
          INFOPLIST_PREPROCESSOR_DEFINITIONS: ALETHEIA_DEV=1
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/App/Resources/Aletheia.entitlements
    dependencies:
      - target: WhisperEngine
      # The only process with network access. XcodeGen embeds an `xpc-service`
      # dependency in Contents/XPCServices. The app itself has no
      # `com.apple.security.network.client` entitlement.
      - target: AletheiaNetworkHelper
      # Listed so Xcode copies whisper.framework into the app bundle (it only
      # embeds a package's binary framework for the target that names it).
      - package: WhisperCpp
      - package: LlamaCpp
      - sdk: ScreenCaptureKit.framework
      - sdk: AVFoundation.framework
      - sdk: Speech.framework

  # The Swift surface over whisper.cpp; the C API stays inside it.
  WhisperEngine:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/WhisperEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aletheia.WhisperEngine
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: WhisperCpp

  # The sandboxed XPC service that makes every outbound request (update check,
  # model downloads). Its entitlements are exactly app-sandbox + network.client:
  # no file, app-group or keychain access, so it cannot read patient data.
  # scripts/check-entitlements.sh guards both halves of that split.
  AletheiaNetworkHelper:
    type: xpc-service
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/NetworkHelper
        excludes:
          - "Info.plist"
          - "NetworkHelper.entitlements"
      - path: Sources/NetworkHelperShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aletheia.networkhelper
        PRODUCT_NAME: NetworkHelper
        # Hand-maintained files, pointed at directly (see the Aletheia target).
        INFOPLIST_FILE: Sources/NetworkHelper/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/NetworkHelper/NetworkHelper.entitlements

  AletheiaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/AletheiaTests
      # The helper's fetch logic and asset table, compiled into the test bundle
      # so they can be exercised without launching the XPC service.
      - path: Sources/NetworkHelper/AssetCatalog.swift
      - path: Sources/NetworkHelper/HelperError.swift
      - path: Sources/NetworkHelper/HelperFetcher.swift
      - path: Sources/NetworkHelper/HelperTasks.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aletheia.appTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Aletheia
      - target: WhisperEngine
        embed: false

  # The acceptance suite: one fitness function per check in
  # docs/spec/ACCEPTANCE-CRITERIA.md, written against the domain DSL (see
  # docs/spec/EXECUTION-LAYER.md). Hosted by the app like AletheiaTests, but run
  # through its own scheme so the unit-test runs stay as they are.
  AletheiaAcceptance:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/AletheiaAcceptance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aletheia.appAcceptance
        GENERATE_INFOPLIST_FILE: YES
        # XCTest creates this class when the bundle loads; it registers the
        # ledger observer (Tests/AletheiaAcceptance/Ledger).
        INFOPLIST_KEY_NSPrincipalClass: AcceptanceLedgerPrincipal
    dependencies:
      - target: Aletheia
      - target: WhisperEngine
        embed: false

schemes:
  AletheiaAcceptance:
    build:
      targets:
        Aletheia: all
        AletheiaNetworkHelper: all
        AletheiaAcceptance: [test]
    test:
      targets:
        - AletheiaAcceptance
    run:
      config: Debug
  Aletheia:
    build:
      targets:
        Aletheia: all
        AletheiaNetworkHelper: all
        AletheiaTests: [test]
    test:
      targets:
        - AletheiaTests
    run:
      config: Debug
