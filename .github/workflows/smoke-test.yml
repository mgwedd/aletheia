name: Smoke Test

# Builds the app and runs the unit tests on a real macOS runner. This is
# the first place SessionNotes is actually compiled (it's authored without
# access to macOS/Xcode), so the primary goal is catching build breakage —
# the unit tests are a bonus that also run here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    # macos-15 ships Xcode 16, whose project format XcodeGen emits; the
    # older macos-14 image (Xcode 15.4) can't read it.
    runs-on: macos-15
    defaults:
      run:
        working-directory: SessionNotes
    steps:
      - uses: actions/checkout@v4

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Cache the resolved Swift packages (SwiftWhisper + its whisper.cpp
      # sources) so we don't re-clone them every run. Keyed on the project
      # spec, which is where the dependency versions live.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SessionNotes/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('SessionNotes/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # Resolving SwiftWhisper (which compiles whisper.cpp) is the slow,
      # network-dependent step; do it once up front so a failure here is
      # clearly a dependency problem rather than a build problem.
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project SessionNotes.xcodeproj -scheme SessionNotes -derivedDataPath build

      - name: Build
        run: |
          xcodebuild build \
            -project SessionNotes.xcodeproj \
            -scheme SessionNotes \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project SessionNotes.xcodeproj \
            -scheme SessionNotes \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -enableCodeCoverage YES \
            -resultBundlePath build/TestResults.xcresult

      - name: Code coverage summary
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            echo '### Code coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report --only-targets build/TestResults.xcresult >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
