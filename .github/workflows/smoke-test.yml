name: Smoke Test

# Builds the app and runs the unit tests on real macOS runners. This is the
# first place Aletheia is actually compiled (it's authored without access
# to macOS/Xcode), so the primary goal is catching build breakage — the unit
# tests are a bonus that also run here.
#
# Supply-chain note: only first-party GitHub actions (checkout, cache,
# upload-artifact) and Homebrew CLIs (xcodegen, xcbeautify) are used — no
# third-party marketplace actions.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  # Manual run (Actions tab): all three tiers, e.g. to check preview on a branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group so a manual run on main can't cancel the
  # push run that Auto Release waits for.
  group: smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Least-privilege guard: production must not request calendar access (EventKit
  # scheduling is a `.dev` feature), dev must. Pure shell on a cheap Linux runner
  # — no toolchain needed — so it fails fast, before the macOS matrix spins up.
  entitlements-guard:
    name: Entitlements guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check per-tier entitlements
        run: ./scripts/check-entitlements.sh
      - name: Self-test the entitlements guard
        run: ./scripts/check-entitlements.sh --self-test
      # Screens take every color from Theme (CLAUDE.md, Conventions).
      - name: Self-test the theme color guard
        run: ./scripts/check-theme-colors.sh --self-test
      - name: Check screens use theme colors
        run: ./scripts/check-theme-colors.sh
      # Every AuditAction must be recorded somewhere (an unwired one leaves the log empty).
      - name: Self-test the audit wiring guard
        run: ./scripts/check-audit-wiring.sh --self-test
      - name: Check audit actions are recorded
        run: ./scripts/check-audit-wiring.sh
      # The workflows' macOS gating: tier test subsets, path-gated benchmark and
      # packaging jobs (job-level `if:`, never `on.paths`), unchanged job names.
      - name: Self-test the CI gating guard
        run: ./scripts/check-ci-gating.sh --self-test
      - name: Check CI gating
        run: ./scripts/check-ci-gating.sh
      # The release workflow runs the real check on tags; PR CI only proves the checker works.
      - name: Self-test the license keyring guard
        run: ./scripts/check-license-keys.sh --self-test

  # Is this more than a docs change? Cheap Ubuntu job; build-and-test reads it.
  changes:
    name: Code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does this change more than docs?
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "code=$(./scripts/ci-changes.sh code "$BASE_SHA")" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build & test (${{ matrix.tier }}, ${{ matrix.runner }})
    # A docs-only pull request needs no build. A job skipped by `if:` would
    # report its check under the unexpanded matrix name, leaving the required
    # "Build & test (dev, macos-15)" pending, so instead the job runs on Ubuntu
    # with every step skipped: same check names, success in seconds, no macOS
    # runner. If `changes` fails, its output is empty and the job builds.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.runner }}
    timeout-minutes: 40
    # Build AND test each build tier, so a production or preview binary that
    # fails to compile (or a tier that composes the wrong feature set) is caught
    # here — not just the dev build. Each tier maps to a set of Swift active
    # compilation conditions (see TIER_CONDITIONS below / BuildTier). Tests run
    # in the Debug config (Hardened Runtime off, so XCTest can inject) with the
    # tier's conditions overridden on the command line; scripts/build.sh + cd.yml
    # separately validate the actual Release/Hardened-Runtime production build.
    #
    # macOS 26 exercises Xcode 26, whose SDK includes FoundationModels — the
    # only place the Apple Intelligence backend actually compiles. It's a
    # canary (continue-on-error) so a newest-toolchain hiccup surfaces without
    # blocking the merge, while macos-15 (Xcode 16) stays the required signal.
    #
    # To save macOS minutes (billed 10x), the matrix runs on macos-15 (the
    # required signal); on main pushes and manual dispatch a single macos-26
    # dev-tier canary is added (the dev tier compiles the whole surface).
    #
    # Pull requests build production and dev only, to fit more PRs into the
    # five concurrent macOS runners. Preview adds almost nothing there: its
    # only own code is `BuildTier.compiled` returning `.preview` (every other
    # tier branch is `#if ALETHEIA_DEV`, compiled by dev and by production),
    # and its feature set is composed at runtime and tested for every tier in
    # the dev suite. Preview still builds and tests on every push to main and
    # on a manual run, so a broken preview binary shows up one merge later.
    continue-on-error: ${{ matrix.runner == 'macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ github.event_name == 'pull_request' && fromJSON('["production","dev"]') || fromJSON('["production","preview","dev"]') }}
        runner: [macos-15]
        include: ${{ github.event_name == 'pull_request' && fromJSON('[]') || fromJSON('[{"tier":"dev","runner":"macos-26"}]') }}
    env:
      # False only for a docs-only pull request (see `changes`); gates every step.
      RUN_BUILD: ${{ needs.changes.outputs.code != 'false' }}
      # Stream xcodebuild output line-by-line so the xcbeautify pipe renders in
      # real time instead of buffering until the step ends.
      NSUnbufferedIO: "YES"
      # Run the test-host app in the foreground, so the tests that need a key
      # window run here (locally they skip; the app stays in the background).
      TEST_RUNNER_ALETHEIA_FOREGROUND_TESTS: "1"
      # Let the test host use the real login Keychain, so the Keychain store
      # tests run here (locally they skip and use an in-memory store).
      TEST_RUNNER_ALETHEIA_LIVE_KEYCHAIN: "1"
      # The Swift active compilation conditions for this job's tier. The tiers
      # nest (production ⊂ preview ⊂ dev); DEBUG is kept so the tier is built in
      # the test-friendly Debug configuration.
      TIER_CONDITIONS: >-
        ${{ (matrix.tier == 'dev' && 'DEBUG ALETHEIA_PREVIEW ALETHEIA_DEV')
            || (matrix.tier == 'preview' && 'DEBUG ALETHEIA_PREVIEW')
            || 'DEBUG' }}
    steps:
      - name: Docs-only change, nothing to build
        if: env.RUN_BUILD != 'true'
        run: echo "Only documentation changed; skipping the build and tests."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: env.RUN_BUILD == 'true'

      - name: Show selected Xcode
        if: env.RUN_BUILD == 'true'
        run: xcodebuild -version

      - name: Install tools (XcodeGen, xcbeautify)
        if: env.RUN_BUILD == 'true'
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        if: env.RUN_BUILD == 'true'
        run: xcodegen generate

      # Cache the resolved Swift packages (the pinned whisper.cpp and llama.cpp XCFrameworks)
      # so we don't re-download them every run. Keyed on where dependency versions
      # live and the runner image, so each Xcode toolchain keeps its own cache.
      - name: Cache Swift packages
        if: env.RUN_BUILD == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/SourcePackages
          key: spm-${{ matrix.runner }}-${{ hashFiles('project.yml', 'Packages/WhisperCpp/Package.swift', 'Packages/LlamaCpp/Package.swift') }}
          restore-keys: spm-${{ matrix.runner }}-

      # Resolving packages (downloading the whisper.cpp XCFramework) is the
      # network-dependent step; do it once up front so a failure here is clearly
      # a dependency problem rather than a build problem.
      - name: Resolve Swift packages
        if: env.RUN_BUILD == 'true'
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project Aletheia.xcodeproj \
            -scheme Aletheia \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions

      - name: Build (${{ matrix.tier }} tier)
        if: env.RUN_BUILD == 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -project Aletheia.xcodeproj \
            -scheme Aletheia \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$TIER_CONDITIONS" \
            | xcbeautify --renderer github-actions

      # The tiers nest (production < preview < dev) and the dev tier compiles
      # the whole surface, so dev runs the full suite. Production and preview are
      # built above (catching a tier that fails to compile) and then run only the
      # tier-sensitive tests: the ones that branch on the tier's compilation
      # conditions or compose the real feature catalog. This keeps the macOS
      # time per PR down. scripts/check-ci-gating.sh checks every class named
      # here exists. Add a class here when a new test depends on the tier.
      - name: Run unit tests (${{ matrix.tier }} tier)
        if: env.RUN_BUILD == 'true'
        run: |
          set -o pipefail
          ONLY=()
          COVERAGE=YES
          if [ "${{ matrix.tier }}" != "dev" ]; then
            COVERAGE=NO
            for t in \
              BuildTierTests \
              FeatureRegistryTests \
              ProductionTierCompositionTests \
              AtRestEncryptionFeatureModuleTests \
              EmbeddedLlamaFeatureModuleTests \
              EventKitSchedulingFeatureModuleTests \
              PatientMedicationsFeatureModuleTests \
              SourceCitationsFeatureModuleTests \
              SpotlightFeatureModuleTests \
              SuggestedQuestionsFeatureModuleTests \
              UpdateServiceTests; do
              ONLY+=("-only-testing:AletheiaTests/$t")
            done
          fi
          xcodebuild test \
            -project Aletheia.xcodeproj \
            -scheme Aletheia \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -enableCodeCoverage "$COVERAGE" \
            -resultBundlePath build/TestResults.xcresult \
            ${ONLY[@]+"${ONLY[@]}"} \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$TIER_CONDITIONS" \
            | xcbeautify --renderer github-actions

      - name: Code coverage summary
        if: always() && matrix.tier == 'dev' && env.RUN_BUILD == 'true'
        run: |
          if [ -d build/TestResults.xcresult ]; then
            echo "### Code coverage (${{ matrix.tier }} tier, ${{ matrix.runner }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report --only-targets build/TestResults.xcresult >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # On failure, keep the result bundle so a maintainer can open it in Xcode
      # and see exactly which test/assertion failed without re-running CI.
      - name: Upload test results on failure
        if: failure() && env.RUN_BUILD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-${{ matrix.tier }}-${{ matrix.runner }}
          path: build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
