name: Release

# Cutting a release: push a tag like `v1.1.0`. This builds the app, packages a
# drag-to-Applications DMG, generates the `appcast.json` the in-app updater
# polls, and publishes both as a GitHub Release.
#
# Signing/notarization uses secrets in the `release` environment. A TAG release
# requires them and fails without them (set the repository variable
# ALLOW_UNSIGNED_RELEASE=true to publish an ad-hoc build anyway). A dry run
# builds with or without them; without them the build is ad-hoc signed (first
# launch needs right-click → Open). Set each with `gh secret set NAME --env
# release` (hidden prompt, or piped on stdin).
#   MACOS_CERTIFICATE            base64 of your Developer ID Application .p12
#   MACOS_CERTIFICATE_PWD        password for that .p12
#   KEYCHAIN_PASSWORD            any strong throwaway string
#   ASC_API_KEY                  contents of the App Store Connect API key (.p8)
#   ASC_API_KEY_ID               that key's 10-char Key ID
#   ASC_API_ISSUER_ID            Issuer ID (UUID) shown above the Team Keys list
#
#   signing secrets only        -> signed app and DMG, not notarized
#   signing + notarization      -> signed, notarized, stapled DMG
#   notarization without signing is skipped (Apple rejects ad-hoc code)
#
# Dry run: Actions -> Release -> Run workflow on any branch. Everything runs
# (build, sign, verify, notarize, staple) but nothing is published; the DMG is
# attached to the run as an artifact. Use it to prove the secrets before
# tagging a real release. Only a tag publishes.
#
# Supply-chain note: no third-party actions — signing uses the built-in
# `security`/`codesign`, notarization uses `xcrun notarytool`/`stapler`,
# packaging uses `hdiutil`, and publishing uses the pre-installed `gh` CLI.

on:
  # Manual/automated tags: push a `v*` tag directly, or let auto-release.yml
  # dispatch this against the tag it just created (a tag pushed by the default
  # GITHUB_TOKEN can't trigger `push`, so the automation dispatches instead).
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    # The signing and notarization secrets live in this environment, which
    # requires an approval before the job starts.
    environment: release
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARIZATION: ${{ secrets.ASC_API_KEY != '' && secrets.ASC_API_KEY_ID != '' && secrets.ASC_API_ISSUER_ID != '' }}
      # Only a tag publishes. Dispatching from a branch is a dry run.
      IS_TAG: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # A published release reaches every user through the updater, so a tag
      # must ship signed and notarized: fail before building rather than
      # publish a DMG Gatekeeper warns about. Dry runs (branch dispatch) still
      # build without the secrets. Set the repository variable
      # ALLOW_UNSIGNED_RELEASE to `true` to publish an ad-hoc build anyway.
      - name: Require a signed, notarized build for a tag
        if: env.IS_TAG == 'true' && vars.ALLOW_UNSIGNED_RELEASE != 'true'
        run: |
          if [ "${HAS_SIGNING}" != "true" ] || [ "${HAS_NOTARIZATION}" != "true" ]; then
            echo "::error::A tag release needs the signing and notarization secrets in the release environment (or ALLOW_UNSIGNED_RELEASE=true)."
            exit 1
          fi

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE_PWD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::error::MACOS_CERTIFICATE_PWD and KEYCHAIN_PASSWORD must be set when signing."
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$CERT_PATH"
          # Put our keychain first on the search list, keeping the existing ones.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "Signing identities in the temporary keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN"

          # Sign by certificate hash from this keychain, so nothing depends on
          # a hand-typed identity name or the keychain search list.
          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE."
            exit 1
          fi
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build Release app
        run: |
          set -euo pipefail
          if [ "${HAS_SIGNING}" = "true" ]; then
            export CODE_SIGN_IDENTITY="$SIGN_IDENTITY"
            export OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $SIGN_KEYCHAIN"
          fi
          ./scripts/build.sh

      # Fail here, with a readable message, rather than after a slow
      # notarization round trip. Notarization requires all four.
      - name: Verify Developer ID signature
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          APP="dist/Aletheia.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          INFO="$(codesign -dvv "$APP" 2>&1)"
          echo "$INFO"
          echo "$INFO" | grep -q 'Authority=Developer ID Application' \
            || { echo "::error::Not signed with a Developer ID Application certificate"; exit 1; }
          echo "$INFO" | grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' \
            || { echo "::error::Hardened Runtime is not enabled"; exit 1; }
          echo "$INFO" | grep -q 'Timestamp=' \
            || { echo "::error::No secure timestamp on the signature"; exit 1; }
          if codesign -d --entitlements :- "$APP" 2>&1 | grep -q 'get-task-allow'; then
            echo "::error::get-task-allow is set; Apple rejects debuggable builds"
            exit 1
          fi

      - name: Package DMG and appcast
        id: package
        run: |
          set -euo pipefail
          if [ "${IS_TAG}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dryrun"
          fi
          APP="dist/Aletheia.app"
          test -d "$APP"

          STAGING="dist/dmg"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          DMG="dist/Aletheia-${VERSION}.dmg"
          hdiutil create -volname "Aletheia" -srcfolder "$STAGING" -ov -format UDZO "$DMG"

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Aletheia-${VERSION}.dmg"
          # The version's CHANGELOG entry, which Auto Release wrote into the
          # tagged commit. jq escapes it for JSON.
          ./scripts/release-notes.sh "$VERSION" > dist/release-notes.md
          jq -n \
            --arg version "$VERSION" \
            --arg url "$DOWNLOAD_URL" \
            --rawfile notes dist/release-notes.md \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, downloadURL: $url, releaseNotes: $notes,
              minimumSystemVersion: "14.0", publishedAt: $published}' \
            > dist/appcast.json

          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sign DMG
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          codesign --force --sign "$SIGN_IDENTITY" --keychain "$SIGN_KEYCHAIN" --timestamp "${{ steps.package.outputs.dmg }}"
          codesign --verify --verbose=2 "${{ steps.package.outputs.dmg }}"

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARIZATION == 'true'
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="${{ steps.package.outputs.dmg }}"

          # notarytool takes the API key as a file.
          KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          umask 077
          printf '%s\n' "$ASC_API_KEY" > "$KEY_PATH"
          if ! head -n 1 "$KEY_PATH" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::ASC_API_KEY must be the .p8 file's text as-is ($(wc -l < "$KEY_PATH" | tr -d ' ') lines found, first line is not the BEGIN PRIVATE KEY header). Set it with: gh secret set ASC_API_KEY --env release < AuthKey_XXXX.p8"
            exit 1
          fi

          # notarytool exits 0 even when Apple rejects the build, so read the
          # status, and print Apple's log (the only place the reason appears).
          set +e
          OUT="$(xcrun notarytool submit "$DMG" \
            --key "$KEY_PATH" \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_ISSUER_ID" \
            --wait 2>&1)"
          STATUS=$?
          set -e
          echo "$OUT"
          if [ "$STATUS" -ne 0 ] || ! echo "$OUT" | grep -q 'status: Accepted'; then
            SUB_ID="$(echo "$OUT" | awk '/^ *id:/ {print $2; exit}')"
            if [ -n "$SUB_ID" ]; then
              xcrun notarytool log "$SUB_ID" \
                --key "$KEY_PATH" \
                --key-id "$ASC_API_KEY_ID" \
                --issuer "$ASC_API_ISSUER_ID" || true
            fi
            echo "::error::Notarization was not accepted; see the log above."
            exit 1
          fi

          # Stapling fetches the ticket from Apple's CDN, which can drop the
          # connection (Error 68) right after an accepted notarization. Retry
          # with exponential backoff capped at 2 min (~10 min in all).
          delay=15
          for attempt in 1 2 3 4 5 6 7 8; do
            xcrun stapler staple "$DMG" && break
            [ "$attempt" -eq 8 ] && { echo "::error::Stapling failed after $attempt attempts."; exit 1; }
            echo "Stapling failed (attempt $attempt); retrying in ${delay}s."
            sleep "$delay"
            delay=$(( delay * 2 > 120 ? 120 : delay * 2 ))
          done
          xcrun stapler validate "$DMG"

          # Gatekeeper's verdict on the DMG, and on the app inside it as a
          # user would first open it.
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          spctl --assess --type execute --verbose=2 "$MOUNT/Aletheia.app" || { hdiutil detach "$MOUNT" >/dev/null; exit 1; }
          hdiutil detach "$MOUNT" >/dev/null

          echo "NOTARIZED=true" >> "$GITHUB_ENV"

      # The unit tests run a Debug build without Hardened Runtime. This starts
      # the build users get, copied out of the DMG, and fails if it doesn't
      # stay up (a missing entitlement, a library the runtime won't load).
      - name: Launch the packaged app
        run: ./scripts/launch-smoke.sh "${{ steps.package.outputs.dmg }}"

      - name: Create GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          set -euo pipefail
          # Second guard: whatever the secrets said, publish only what was
          # actually notarized and stapled above.
          if [ "${NOTARIZED:-false}" != "true" ] && [ "${ALLOW_UNSIGNED_RELEASE:-}" != "true" ]; then
            echo "::error::The DMG was not notarized; not publishing."
            exit 1
          fi
          if [ "${NOTARIZED:-false}" = "true" ]; then
            LAUNCH_NOTE="Signed with Developer ID and notarized — opens with a double-click."
          elif [ "${HAS_SIGNING}" = "true" ]; then
            LAUNCH_NOTE="Signed with Developer ID but not notarized: first launch, right-click the app and choose Open."
          else
            LAUNCH_NOTE="First launch: right-click the app and choose Open (ad-hoc signed, not notarized)."
          fi
          { cat dist/release-notes.md; printf '\n%s\n' "$LAUNCH_NOTE"; } > dist/release-body.md
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.dmg }}" \
            "dist/appcast.json" \
            --title "Aletheia ${{ steps.package.outputs.version }}" \
            --notes-file dist/release-body.md \
            --verify-tag

      - name: Attach dry-run DMG
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: aletheia-dryrun-dmg
          path: ${{ steps.package.outputs.dmg }}
          retention-days: 3
