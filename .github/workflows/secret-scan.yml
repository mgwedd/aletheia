name: Secret Scan

# Leak-prevention gate: fails the build if a secret, credential, or PHI artifact
# is ever committed. Runs on Linux (cheap — and free on a public repo), so it's
# safe to keep on every PR and push.
#
# First-party only: actions/checkout + a repo script (scripts/scan-secrets.sh),
# no third-party scanner. Complements GitHub's native secret scanning / push
# protection (enable both in Settings → Code security for defense in depth).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan for secrets & PHI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run scanner
        run: ./scripts/scan-secrets.sh
