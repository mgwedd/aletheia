name: CD (build artifact)

# Continuous delivery: builds the ad-hoc-signed app, packages a
# drag-to-Applications DMG, and uploads it as a downloadable workflow artifact.
# Versioned, notarized releases are cut separately by release.yml on a tag.
#
# Where it runs: on main pushes and on demand (Run workflow) always, and on a
# pull request only when it touches packaging inputs (project.yml, packages,
# resources/entitlements/Info.plist, this and the release workflow, packaging
# scripts; see scripts/ci-changes.sh). Other PRs skip the macOS job, which
# still reports success to branch protection. Docs-only changes are skipped,
# and concurrency cancels superseded runs so rapid pushes don't stack.
#
# The build is ad-hoc signed (no secrets), so it works the same on a PR from a
# fork as on main; first launch still needs a right-click > Open (see the job
# summary and docs/SETUP-GUIDE.md).
#
# Supply-chain note: only first-party actions (checkout, cache, upload-artifact)
# and Homebrew/Apple built-in CLIs — no third-party marketplace actions.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the macOS packaging job is relevant. On main pushes and
  # manual runs it always is; on a PR only when packaging inputs changed
  # (scripts/ci-changes.sh lists the paths). Not an `on.paths` filter: a
  # skipped workflow leaves a required check pending forever, whereas a job
  # skipped by `if:` reports success.
  changes:
    name: Packaging changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.diff.outputs.package }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Did packaging inputs change?
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "package=$(./scripts/ci-changes.sh package "$BASE_SHA")" >> "$GITHUB_OUTPUT"

  package:
    name: Build & package (macOS)
    needs: changes
    # Fail open: if the changes job itself fails, run the build anyway.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.package == 'true') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Show selected Xcode
        run: xcodebuild -version

      # Same SPM cache key as smoke-test so the two workflows share the
      # resolved whisper.cpp and llama.cpp XCFrameworks.
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: build/SourcePackages
          key: spm-macos-15-${{ hashFiles('project.yml', 'Packages/WhisperCpp/Package.swift', 'Packages/LlamaCpp/Package.swift') }}
          restore-keys: spm-macos-15-

      - name: Build Release app (ad-hoc signed)
        run: ./scripts/build.sh

      - name: Package DMG
        id: dmg
        env:
          # On a pull_request event GITHUB_SHA is the ephemeral merge commit;
          # the PR's own head sha is the one a tester can match to a commit.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          APP="dist/Aletheia.app"
          test -d "$APP"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          if [ -n "${PR_NUMBER:-}" ]; then
            SHORT_SHA="${HEAD_SHA::7}"
            BASENAME="Aletheia-${VERSION}-pr${PR_NUMBER}-${SHORT_SHA}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            BASENAME="Aletheia-${VERSION}-${SHORT_SHA}"
          fi

          STAGING="dist/dmg"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          DMG="dist/${BASENAME}.dmg"
          hdiutil create -volname "Aletheia" -srcfolder "$STAGING" -ov -format UDZO "$DMG"

          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.dmg.outputs.basename }}
          path: dist/${{ steps.dmg.outputs.basename }}.dmg
          retention-days: 14
          if-no-files-found: error

      # Make the download obvious from the run's summary page, with the one
      # gotcha a tester hits on an ad-hoc-signed (un-notarized) build.
      - name: Build summary
        if: always()
        run: |
          {
            echo "### 📦 Downloadable build"
            echo ""
            echo "**\`${{ steps.dmg.outputs.basename }}.dmg\`** (Aletheia ${{ steps.dmg.outputs.version }}) is attached to this run under **Artifacts**, below."
            echo ""
            echo "To test it: download and unzip, open the \`.dmg\`, drag **Aletheia** to Applications, then **right-click → Open** the first time (it's ad-hoc signed, not notarized, so a plain double-click is blocked by Gatekeeper). See \`docs/SETUP-GUIDE.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
