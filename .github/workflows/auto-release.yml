name: Auto Release

# Semantic, first-party release automation — semantic-release's behavior without
# its dependency tree. Once Smoke Test passes on a push to main it reads the
# Conventional Commits since the last `v*` tag, decides the semver bump, stamps
# CHANGELOG.md and Info.plist, tags main HEAD, and hands off to release.yml to
# build and publish the DMG + appcast.
#
# Bump rules (see scripts/compute-release.sh):
#   feat!/BREAKING CHANGE → major · feat → minor · fix/perf/revert → patch
#   only chore/docs/style/refactor/test/ci/build → no release (a quiet no-op).
#
# Releases wait for CI: this runs on a *successful* Smoke Test run for a push to
# main, never on the push itself, so a red or cancelled build is never tagged.
# Smoke Test cancels superseded runs, so the newest passing run releases the
# whole range since the last tag. If main has moved past the tested commit the
# run steps aside and the newer commit's run releases instead.
#
# Nothing releasable since the last tag ⇒ the job succeeds and does nothing, so
# routine merges don't cut versions. Use the manual "Run workflow" button to
# force a bump level, or to dry-run the version math without tagging.
#
# Supply chain: only git + gh (pre-installed) — no third-party actions, no npm.

on:
  workflow_run:
    workflows: ["Smoke Test"]
    types: [completed]
    branches: [main]
  # Docs-only merges never start Smoke Test (it ignores markdown and docs/), so
  # they never reach here. compute-release.sh applies the same rule over the whole
  # tag range as the authoritative gate (so a later code push still releases the
  # docs that rode along).
  workflow_dispatch:
    inputs:
      bump:
        description: "Force a bump level (default: derive from commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Compute the version only; do not commit, tag, or publish"
        type: boolean
        default: false

permissions:
  contents: write   # push the release commit and tag
  actions: write    # dispatch release.yml against the new tag

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and hand off
    runs-on: ubuntu-latest   # pure git work; the macOS build lives in release.yml
    # A pull_request run of Smoke Test can also report here; only a green push
    # run on main, or a manual dispatch, may release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags for version math
          # Release exactly the commit that passed (manual dispatch: its own ref).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check main has not moved past the tested commit
        id: tip
        if: github.event_name == 'workflow_run'
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$TESTED" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "main has moved past $TESTED; the run for the newer commit will release."
          fi

      - name: Compute next version
        id: version
        if: steps.tip.outputs.stale != 'true'
        env:
          FORCE_BUMP: ${{ github.event.inputs.bump || 'auto' }}
        run: ./scripts/compute-release.sh

      - name: Nothing to release
        if: steps.tip.outputs.stale != 'true' && steps.version.outputs.release != 'true'
        run: echo "No releasable commits since the last tag — nothing to do."

      - name: Dry run summary
        if: steps.version.outputs.release == 'true' && github.event.inputs.dry_run == 'true'
        run: |
          echo "Dry run: would release v${{ steps.version.outputs.next }} (${{ steps.version.outputs.bump }} bump from ${{ steps.version.outputs.current }})."

      - name: Apply version, changelog, and tag
        if: steps.version.outputs.release == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/apply-release.sh "$NEXT"
          git add Sources/App/Resources/Info.plist CHANGELOG.md
          # [skip ci] is belt-and-suspenders: a commit pushed with GITHUB_TOKEN
          # already can't re-trigger this workflow (recursion is suppressed).
          git commit -m "chore(release): v${NEXT} [skip ci]"
          git tag -a "v${NEXT}" -m "Aletheia ${NEXT}"
          git push origin HEAD:main
          git push origin "v${NEXT}"

      - name: Trigger build and publish
        if: steps.version.outputs.release == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          # The tag push above can't trigger release.yml (default-token pushes
          # don't start workflows), so dispatch it explicitly against the tag.
          gh workflow run release.yml --ref "v${NEXT}"
          echo "Dispatched release.yml for v${NEXT}."
